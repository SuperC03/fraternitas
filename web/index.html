        <span class="countdown font-mono text-5xl">
          <span style="--value:00;" aria-live="polite" id="minutes">00</span>
        </span>
        min
      </div>
      <div class="bg-neutral rounded-box text-neutral-content flex flex-col p-2">
        <span class="countdown font-mono text-5xl">
          <span style="--value:00;" aria-live="polite" id="seconds">00</span>
        </span>
